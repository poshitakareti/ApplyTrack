
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ApplyTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<header class="navbar">
    <a href="index.html" class="logo">
        🎓 Apply<span>Track</span>
    </a>

    <a href="index.html" class="btn btn-outline">Home</a>
</header>

<main class="auth-container">

    <section class="auth-card">

        <p class="eyebrow">START YOUR JOURNEY</p>

        <h1>Create your account</h1>

        <p class="auth-subtitle">
            Organize your placement applications with ApplyTrack.
        </p>

        <div id="message"
             class="form-message"
             role="status"
             aria-live="polite">
        </div>

        <form action="register" method="post">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        maxlength="100"
                        autocomplete="name"
                        placeholder="Enter your full name"
                        required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="150"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        maxlength="72"
                        pattern="[ -~]{8,72}"
                        title="Use 8–72 ASCII characters."
                        autocomplete="new-password"
                        placeholder="At least 8 characters"
                        required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="8"
                        maxlength="72"
                        pattern="[ -~]{8,72}"
                        autocomplete="new-password"
                        placeholder="Re-enter your password"
                        required>
            </div>

            <button type="submit" class="btn btn-primary form-button">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already registered?
            <a href="login.html">Login here</a>
        </p>

    </section>

</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const message = document.getElementById("message");

    const messages = {
        invalid: "Please enter valid details in all fields.",
        password: "Use a password between 8 and 72 characters.",
        mismatch: "The passwords do not match.",
        duplicate: "This email is already registered.",
        failed: "Registration failed. Please try again."
    };

    if (params.get("success") === "true") {

        message.textContent =
            "Account created successfully! Login will be available soon.";

        message.classList.add("success-message");

    } else if (messages[params.get("error")]) {

        message.textContent =
            messages[params.get("error")];

        message.classList.add("error-message");
    }
</script>

</body>
</html>
